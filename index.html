<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ross Wojcik — Get In Touch</title>
  <style>
    :root {
      --color-bg:        #0f0f0f;
      --color-surface:   #1a1a1a;
      --color-border:    #2a2a2a;
      --color-text:      #e8e8e8;
      --color-muted:     #9a9a9a;
      --color-accent:    #6366f1;
      --color-accent-h:  #818cf8;
      --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    main {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 0.9rem;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      color: var(--color-muted);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    p.sub {
      color: var(--color-muted);
      font-size: 1.05rem;
      margin-bottom: 2.5rem;
    }

    .contact-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .contact-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      color: var(--color-text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .contact-link:hover {
      border-color: var(--color-accent-h);
      color: var(--color-accent-h);
      transform: translateY(-1px);
    }

    .contact-link.primary {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: #fff;
    }

    .contact-link.primary:hover {
      background: var(--color-accent-h);
      border-color: var(--color-accent-h);
      color: #fff;
    }

    footer {
      margin-top: 2.5rem;
      color: var(--color-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Work in Progress</span>
    <h1>Ross Wojcik</h1>
    <p class="sub">Work in progress.</p>

    <div class="contact-card">
      <a class="contact-link primary" href="mailto:ross@glacierforged.com">Email — ross@glacierforged.com</a>
      <a class="contact-link" href="https://linkedin.com/in/ross-wojcik/" target="_blank" rel="noopener noreferrer">LinkedIn — linkedin.com/in/ross-wojcik</a>
    </div>

    <footer>&copy; 2026 Ross Wojcik</footer>
  </main>
</body>
</html>
